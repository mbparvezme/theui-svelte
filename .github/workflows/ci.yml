name: CI

# Runs on every push and pull request, so a broken type, lint error or failing test
# shows up before release day. Publishing is a separate workflow.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npx eslint .
      - run: npm run test:unit -- --run

      # Catches a packaging mistake, such as an export that points at a file
      # svelte-package never wrote, without publishing anything.
      - run: npm run prepack
