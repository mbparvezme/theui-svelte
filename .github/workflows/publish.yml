name: Publish to NPM

# npm refuses a version that already exists, so publishing on every push to main
# fails on every push that is not a release. A GitHub release is the signal instead:
# tag the commit, publish the release, and this runs once for that version.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm attach a provenance statement to the package

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - run: npm ci
      - run: npm run check
      # Unit tests only. The e2e suite needs browsers installed, which this job does not do.
      - run: npm run test:unit -- --run
      # `npm publish` runs the prepack script by itself, which builds dist and lints
      # the package with publint, so there is no separate build step here.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
